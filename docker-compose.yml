services:
  moisture_backend:
    build:
      context: ./backend
    container_name: moisture_backend
    restart: unless-stopped
    environment:
      API_TOKEN: ${API_TOKEN}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8000:8000"
    networks:
      - postgres-server_default

networks:
  postgres-server_default:
    external: true